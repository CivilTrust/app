name: iOS unsigned preflight (not NFC acceptance)

# Manual only: preparing this workflow does not spend runner time or deploy an app.
on:
  workflow_dispatch:
    inputs:
      flutter_ref:
        description: Flutter release tag compatible with pubspec (local baseline 3.47.7)
        required: true
        default: '3.47.7'

permissions:
  contents: read

jobs:
  compile:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install selected Flutter release from official repository
        env:
          FLUTTER_REF: ${{ inputs.flutter_ref }}
        run: |
          git clone --depth 1 --branch "$FLUTTER_REF" https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          printf '%s\n' "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Record toolchain (no signing secrets)
        run: |
          xcodebuild -version
          flutter --version
          pod --version
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub
      - name: Compile native skeleton only
        run: flutter build ios --debug --no-codesign --no-pub --dart-define=IDENTITY_MODE=native-lab --dart-define=NOTARY_ENABLED=false
      # No IPA, signing, TestFlight upload, NFC SDK or physical-chip claim.
